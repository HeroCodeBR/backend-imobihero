version: '3.8'
services:
  # Database for Users Microservice
  db-users:
    image: postgres:14
    environment:
      - POSTGRES_USER=alexiakattah
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=users
    volumes:
      - pgdata_users:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Database for Properties Microservice
  db-properties:
    image: postgres:14
    environment:
      - POSTGRES_USER=properties_user
      - POSTGRES_PASSWORD=properties_pass
      - POSTGRES_DB=properties_db
    volumes:
      - pgdata_properties:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true

  # Users Microservice
  api-users: 
    build:
      context: ./users
      dockerfile: Dockerfile.dev
    ports:
      - "3333:3333"
    depends_on:
      - db-users
      - kafka
    environment:
      - DATABASE_URL=postgresql://alexiakattah:root@db-users:5432/users
      - KAFKA_BROKERS=kafka:9092
    restart: ${DOCKER_RESTART_POLICY:-unless-stopped}

  # Properties Microservice
  api-properties:
    build:
      context: ./properties
      dockerfile: Dockerfile.dev
    ports:
      - "3334:3334"
    depends_on:
      - db-properties
      - kafka
    environment:
      - DATABASE_URL=postgresql://properties_user:properties_pass@db-properties:5432/properties_db
      - KAFKA_BROKERS=kafka:9092
      - USER_SERVICE_URL=http://api-users:3333
      - PORT=3334
    restart: ${DOCKER_RESTART_POLICY:-unless-stopped}

volumes:
  pgdata_users:
  pgdata_properties:
